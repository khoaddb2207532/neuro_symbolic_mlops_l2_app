# ============================================================
# Cấu hình trung tâm cho toàn bộ pipeline.
# ============================================================

seed: 42
data_dir: "D:/32526_LV/vietnamese_cultural_dataset"
output_dir: "outputs"
num_classes: 9
batch_size: 64
num_workers: 4
num_epochs: 100
patience: 5
weight_decay: !!float 1e-4
monitor_metric: "val_acc"

transfer_learning:
  lr_head: !!float 1e-3
  lr_backbone: !!float 1e-4

baseline_comparison:
  selected_architecture: mobilenetv3_small
  pretrained: true

features:
  source: "cbm"                        # "cbm" (concept probabilities) hoặc "baseline" (latent)

rules:
  min_support: 0.01
  min_confidence: 0.7


rule_penalty:
  target_model: "cbm"                  # "cbm" hoặc "baseline"
  weight: 0.1
  smoothing: 0.1
  lr_backbone: !!float 1e-5            # LR Stage 5 (CBM): nhỏ hơn Stage 1b để penalty không phá concept đã học; khoảng 1e-5..1e-4
  lr_head: !!float 1e-4
  # concept_weight: 0.5                # bỏ trống = dùng cbm.concept_weight
  penalty_off_epochs: 3                # số epoch đầu TẮT rule penalty (chỉ CE + concept BCE); 0 = bật ngay
  initial_temp: 6.0                    # T khởi đầu (sigmoid(T·(p-ngưỡng))); cao hơn = khớp luật gần "cứng" hơn. Cũ: 2.0
  final_temp: 12.0
  temp_warmup_epochs: 2
  temp_anneal_epochs: 10
  min_epochs_before_early_stop: 12
  # --- Nguồn luật và cách dùng (xem README mục "Luật từ image_concept") ---
  rules_dir: "04_filtered_rules"       # 04_filtered_rules = luật RF cũ | 04c_concept_rules = GFlowNet xây từ concept
  mode: "penalty"                      # penalty = regularizer (cũ) | head = khối luật mới | both = cả hai (chỉ target cbm)
  head_temperature: 10.0               # độ "cứng" của khớp luật trong khối luật (sigmoid T)
  rule_lr: !!float 1e-3                # LR riêng cho w_r của khối luật (khởi tạo 0, cần LR đủ lớn)

# Dùng bởi pipelines/stage4b_analyze_rule_rankings.py — phân tích SAU khi
# GFlowNet đã train xong (không train lại): p_include vs 2 ranking ngây thơ.
rule_ranking_analysis:
  K: 300                       # số trajectory sample từ policy đã train
  checkpoint: "gflownet_best_diverse.pth"

# Concept Bottleneck Model — ép feature vector về n_concepts chiều (sigmoid),
# mỗi chiều là xác suất xuất hiện của 1 concept.  Concept loss (BCE) ép các
# giá trị này khớp với nhãn concept, giúp mô hình có thể giải thích được.
# Xem src/models/cbm.py và pipelines/stage1b_train_cbm.py.
cbm:
  n_concepts: 54                          # số concept — phải << feature_dim gốc
  concept_weight: 0.5                     # λ: trọng số concept loss; sweep 0.5–5 bằng experiments/sweep_concept_weight.py
  concept_pos_weight: auto                # auto | null: pos_weight theo concept từ tập train (bù mất cân bằng)
  concept_pos_weight_max: 20.0            # kẹp pos_weight để concept hiếm không làm loss bùng nổ
  two_stage: false                         # giai đoạn 1 đóng băng backbone, giai đoạn 2 mở backbone
  stage1_epochs: 5                        # số epoch giai đoạn 1 (phải < num_epochs)
  freeze_backbone: false                  # true = chỉ train concept layer + predictor
  smoothing: 0.1
  concept_annotations_path: "/kaggle/input/datasets/dangduykhoab2207532/mykhmer/image_concepts.json"
  # Đường dẫn file concept annotations (chọn 1 trong 2):
  # concept_annotations_path: "data/concept_annotations.json"   # per-image
  # class_concept_matrix_path: "data/class_concepts.json"        # per-class
  # baseline_checkpoint: "outputs/baseline_comparison/mobilenetv3_small/baseline_best.pth"

# GFlowNet XÂY DỰNG luật conjunction trên nhãn image_concept (stage4_concept_rules_gflownet).
# Luật dạng: (concept_a có mặt ∧ concept_b vắng mặt) ⇒ class. Không dùng RF.
concept_rules:
  source_split: "train"                # split để tính reward. val/test chỉ dùng báo cáo, không chọn luật.
  use_class_prototype: false           # false: ảnh không có nhãn riêng bị loại khỏi reward (không học lại prototype)
  output_subdir: "04c_concept_rules"
  max_literals: 3                      # độ dài tối đa vế trái
  max_rules: 20                        # số luật tối đa trong tập cuối
  min_cover: 5                         # luật phủ ít hơn số mẫu này bị phạt
  max_conflict: 0.2                    # tỉ lệ mẫu phủ bởi luật khác vế phải tối đa khi ghép tập
  min_new_correct: 3                   # luật phải thêm ít nhất ngần này mẫu đúng mới được nhận
  w_prec: 1.0
  w_rec: 0.5
  w_len: 0.1
  w_min_cover: 1.0
  m_estimate: 2.0                      # shrink precision về tần suất lớp khi ít mẫu
  beta: 3.0
  loss_type: "tb"                      # "tb" | "db"
  hidden_dim: 256
  num_iterations: 1000
  batch_size: 256
  lr: !!float 1e-3
  logZ_lr: 0.1
  logZ_warmup_steps: 50
  grad_clip_max_norm: 5.0
  archive_size: 5000
  final_samples: 4000
  log_every: 100

gflownet:
  max_rules: 120
  hidden_dim: 256
  num_iterations: 1000
  batch_size: 256
  lr: !!float 1e-3
  logZ_lr: 0.1
  validation_interval: 100
  loss_type: "tb"          # "tb" | "db" | "fm"
  logZ_warmup_steps: 50
  val_samples: 140
  w_acc: 1.0
  w_cov: 0.5
  w_wrong: 0.75
  w_conflict: 0.1
  beta: 3.0
  grad_clip_max_norm : 5.0
