# ============================================================
# Cấu hình trung tâm cho toàn bộ pipeline (MLOps L2: 1 nguồn config duy nhất).
# DVC theo dõi file này; đổi bất kỳ giá trị nào sẽ tự trigger lại đúng stage
# bị ảnh hưởng (xem dvc.yaml).
# ============================================================

seed: 42
data_dir: "D:/32526_LV/vietnamese_cultural_dataset"
output_dir: "outputs"
num_classes: 12
batch_size: 64
num_workers: 4
num_epochs: 100
patience: 5
weight_decay: !!float 1e-4
monitor_metric: "val_loss"

transfer_learning:
  lr_head: !!float 1e-4
  lr_backbone: !!float 1e-4

baseline_comparison:
  selected_architecture: mobilenetv3_small
  architectures:
    - mobilenetv3_small
    - resnet50
    - densenet121
    - efficientnet_b0
    - swin_t
    - vit_b_16
  pretrained: true

rules:
  min_support: 0.01
  min_confidence: 0.7


rule_penalty:
  weight: 0.1
  smoothing: 0.1
  initial_temp: 2.0
  final_temp: 12.0
  temp_warmup_epochs: 2
  temp_anneal_epochs: 10
  min_epochs_before_early_stop: 12

# Student khởi tạo từ ImageNet; teacher baseline đóng băng chỉ tạo feature để
# các luật đã chọn bỏ phiếu thành soft targets.
rule_distillation:
  weight: 0.1
  temperature: 2.0
  use_confidence: true

# Dùng bởi pipelines/stage5_train_rule_bayesian.py — regularization kiểu
# Bayesian marginalization (frozen GFlowNet sampler, resample K tập luật MỚI
# mỗi bước train CNN, xem src/rules/bayesian_penalty.py).
rule_penalty_bayesian:
  K: 32                        # số tập luật resample mỗi bước (ước lượng MC)
  sampler_checkpoint: "gflownet_best_diverse.pth"

# Dùng bởi pipelines/stage4b_analyze_rule_rankings.py — phân tích SAU khi
# GFlowNet đã train xong (không train lại): p_include vs 2 ranking ngây thơ.
rule_ranking_analysis:
  K: 300                       # số trajectory sample từ policy đã train
  checkpoint: "gflownet_best_diverse.pth"

gflownet:
  max_rules: 120
  hidden_dim: 256
  num_iterations: 5000
  batch_size: 256
  lr: !!float 1e-3
  logZ_lr: 0.1
  validation_interval: 100
  loss_type: "tb"          # "tb" | "db" | "fm"
  logZ_warmup_steps: 50
  val_samples: 140
  w_acc: 1.0
  w_cov: 0.5
  w_wrong: 0.75
  w_conflict: 0.1
  beta: 3.0
  grad_clip_max_norm : 5.0
