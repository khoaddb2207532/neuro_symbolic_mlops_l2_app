# Pipeline DVC — mỗi stage khai báo rõ deps/outs/params nên DVC biết chính
# xác stage nào cần chạy lại khi code hoặc params.yaml thay đổi (Continuous
# Training tự động — yêu cầu cốt lõi của MLOps cấp độ 2).
stages:
  train_baseline:
    cmd: python -m pipelines.stage1_train_baseline --config params.yaml
    deps:
    - pipelines/stage1_train_baseline.py
    - src/models/cnn.py
    - src/training/trainer.py
    - src/data/dataset.py
    params:
    - seed
    - data_dir
    - num_classes
    - batch_size
    - num_epochs
    - patience
    - transfer_learning
    outs:
    - outputs/01_baseline/baseline_best.pth
    - outputs/01_baseline/final_model_weights.pth
    metrics:
    - outputs/01_baseline/dvclive_baseline/metrics.json:
        cache: true

  train_all_baselines:
    cmd: python -m pipelines.train_all_baselines --config params.yaml
    deps:
    - pipelines/train_all_baselines.py
    - src/models/cnn.py
    - src/training/trainer.py
    - src/data/dataset.py
    params:
    - seed
    - data_dir
    - num_classes
    - batch_size
    - num_epochs
    - patience
    - weight_decay
    - transfer_learning
    - baseline_comparison.architectures
    - baseline_comparison.pretrained
    outs:
    - outputs/baseline_comparison

  extract_features:
    cmd: python -m pipelines.stage2_extract_features --config params.yaml
    deps:
    - pipelines/stage2_extract_features.py
    - src/data/features.py
    - outputs/baseline_comparison
    params:
    - baseline_comparison.selected_architecture
    outs:
    - outputs/02_features

  extract_rules:
    cmd: python -m pipelines.stage3_extract_rules --config params.yaml
    deps:
    - pipelines/stage3_extract_rules.py
    - src/data/features.py
    - src/rules/extractor.py
    - src/rules/validator.py
    - outputs/02_features
    params:
    - rules
    outs:
    - outputs/03_rules/raw_rules.pkl
    - outputs/03_rules/rf_model.joblib

  select_rules_gflownet:
    cmd: python -m pipelines.stage4_select_rules_gflownet --config params.yaml
    deps:
    - pipelines/stage4_select_rules_gflownet.py
    - src/gflownet/env.py
    - src/gflownet/pipeline.py
    - outputs/03_rules/raw_rules.pkl
    params:
    - gflownet
    outs:
    - outputs/04_filtered_rules/valid_rules.pkl
    - outputs/04_filtered_rules/selected_rules.pkl
    - outputs/04_filtered_rules/gflownet_rule_order.pkl
    - outputs/04_filtered_rules/gflownet_best_converged.pth
    - outputs/04_filtered_rules/gflownet_best_diverse.pth

  analyze_rule_rankings:
    cmd: python -m pipelines.stage4b_analyze_rule_rankings --config params.yaml
    deps:
    - pipelines/stage4b_analyze_rule_rankings.py
    - src/gflownet/rule_ranking_analysis.py
    - outputs/04_filtered_rules/gflownet_best_diverse.pth
    - outputs/04_filtered_rules/gflownet_rule_order.pkl
    params:
    - rule_ranking_analysis
    outs:
    - outputs/04_filtered_rules/rule_ranking_analysis.csv
    - outputs/04_filtered_rules/rule_ranking_analysis_summary.txt

  train_rule_regularized:
    cmd: python -m pipelines.stage5_train_rule_regularized --config params.yaml
    deps:
    - pipelines/stage5_train_rule_regularized.py
    - src/rules/penalty.py
    - src/training/trainer.py
    - src/utils/checkpoint.py
    - outputs/baseline_comparison
    - outputs/04_filtered_rules/valid_rules.pkl
    - outputs/04_filtered_rules/selected_rules.pkl
    params:
    - baseline_comparison.selected_architecture
    - transfer_learning
    - rule_penalty
    outs:
    - outputs/05_rules_model/final_model_weights.pth
    metrics:
    - outputs/05_rules_model/dvclive_rule_regularized/metrics.json:
        cache: true

  train_rule_regularized_bayesian:
    cmd: python -m pipelines.stage5_train_rule_bayesian --config params.yaml
    deps:
    - pipelines/stage5_train_rule_bayesian.py
    - src/rules/bayesian_penalty.py
    - src/gflownet/rule_ranking_analysis.py
    - src/training/trainer.py
    - src/utils/checkpoint.py
    - outputs/baseline_comparison
    - outputs/04_filtered_rules/gflownet_best_diverse.pth
    - outputs/04_filtered_rules/gflownet_best_converged.pth
    - outputs/04_filtered_rules/gflownet_rule_order.pkl
    params:
    - baseline_comparison.selected_architecture
    - transfer_learning
    - rule_penalty
    - rule_penalty_bayesian
    outs:
    - outputs/05b_rules_model_bayesian/final_model_weights.pth
    - outputs/05b_rules_model_bayesian/gflownet_sampled_rules.pkl
    - outputs/05b_rules_model_bayesian/gflownet_sampled_rules.xlsx
    - outputs/05b_rules_model_bayesian/gflownet_sampling_summary.json
    metrics:
    - outputs/05b_rules_model_bayesian/dvclive_rule_regularized_bayesian/metrics.json:
        cache: true

  train_rule_distillation:
    cmd: python -m pipelines.stage5_distillation --config params.yaml
    deps:
    - pipelines/stage5_distillation.py
    - src/rules/distillation.py
    - src/training/trainer.py
    - src/utils/checkpoint.py
    - outputs/baseline_comparison
    - outputs/04_filtered_rules/selected_rules.pkl
    params:
    - baseline_comparison.selected_architecture
    - transfer_learning
    - rule_penalty
    - rule_distillation
    outs:
    - outputs/05c_rules_distillation/final_model_weights.pth
    metrics:
    - outputs/05c_rules_distillation/dvclive_rule_distillation/metrics.json:
        cache: true
