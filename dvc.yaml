stages:
  audit_data:
    cmd: python -m pipelines.stage0_audit_data --config params.yaml
    deps: [pipelines/stage0_audit_data.py, src/data/audit.py, params.yaml]
    params: [data_dir]
    outs: [outputs/00_data_audit]

  train_baseline:
    cmd: python -m pipelines.stage1_train_baseline --config params.yaml
    deps: [pipelines/stage1_train_baseline.py, src/models/cnn.py, src/training/trainer.py, src/data/dataset.py, src/data/protocol.py, outputs/00_data_audit/summary.json]
    params: [seed, data_dir, data_validation, num_classes, batch_size, num_epochs, patience, learning_rate, weight_decay]
    outs: [checkpoints/cnn_baseline.pt, outputs/01_baseline/baseline_best.pth, outputs/01_baseline/final_model_weights.pth]
    metrics:
      - reports/baseline_metrics.json:
          cache: true
      - outputs/01_baseline/dvclive_baseline/metrics.json:
          cache: true

  extract_features:
    cmd: python -m pipelines.stage2_extract_features --config params.yaml
    deps: [pipelines/stage2_extract_features.py, src/data/features.py, src/models/cnn.py, outputs/01_baselines]
    params: [feature_extraction]
    outs: [outputs/02_features, data/features_train.npy, data/labels_train.npy, data/features_val.npy, data/labels_val.npy, data/cnn_predictions_val.npy, data/features_metadata.json]

  extract_rules:
    cmd: python -m pipelines.stage3_extract_rules --config params.yaml
    deps: [pipelines/stage3_extract_rules.py, src/rules/extractor.py, src/rules/rf_search.py, src/rules/leaf_analysis.py, data/features_train.npy, data/labels_train.npy, data/features_val.npy, data/labels_val.npy, data/cnn_predictions_val.npy, data/features_metadata.json]
    params: [seed, rf, logs_dir]
    outs: [checkpoints/rf_model.pkl, configs/rf_hyperparams.yaml, reports/leaf_stats.csv, outputs/03_rules/raw_rules.pkl, outputs/03_rules/rf_model.joblib, outputs/03_rules/rf_best_config.json]

  filter_rules:
    cmd: python -m pipelines.stage3b_filter_rules --config params.yaml
    deps: [pipelines/stage3b_filter_rules.py, src/rules/leaf_analysis.py, src/rules/filter_search.py, reports/leaf_stats.csv, data/labels_val.npy, outputs/03_rules/raw_rules.pkl]
    params: [num_classes, rule_filter, logs_dir]
    outs: [configs/filter_thresholds.yaml, reports/fidelity_histogram.png, reports/G_c_leaves.json, reports/B_c_leaves.json, outputs/03b_filtered_leaves/leaf_stats.csv, outputs/03b_filtered_leaves/G_c_leaves.json, outputs/03b_filtered_leaves/B_c_leaves.json, outputs/03b_filtered_leaves/filter_search.json]

  select_rules_gflownet:
    cmd: python -m pipelines.stage4_select_rules_gflownet --config params.yaml
    deps: [pipelines/stage4_select_rules_gflownet.py, src/gflownet/leaf_path.py, src/gflownet/leaf_pipeline.py, src/gflownet/validation.py, src/rules/extractor.py, checkpoints/rf_model.pkl, reports/leaf_stats.csv, reports/G_c_leaves.json, reports/B_c_leaves.json]
    params: [gflownet]
    outs: [checkpoints/gfn_good.pt, checkpoints/gfn_bad.pt, configs/gfn_hyperparams.yaml, reports/leaf_probs.json, outputs/04_filtered_rules/gfn_good.pt, outputs/04_filtered_rules/gfn_bad.pt, outputs/04_filtered_rules/leaf_probs.json, outputs/04_filtered_rules/gfn_training_summary.json, outputs/04_filtered_rules/good_rules.pkl, outputs/04_filtered_rules/bad_rules.pkl, outputs/04_filtered_rules/valid_rules.pkl, outputs/04_filtered_rules/selected_rules.pkl]

  train_rule_regularized:
    cmd: python -m pipelines.stage5_regularize_distribution --config params.yaml
    deps: [pipelines/stage5_regularize_distribution.py, src/rules/gfn_distribution_penalty.py, src/training/pareto.py, src/models/cnn.py, reports/leaf_probs.json, outputs/01_baselines, checkpoints/rf_model.pkl]
    params: [seed, data_dir, batch_size, num_workers, num_classes, weight_decay, feature_extraction, regularize, drift.check_every_epochs]
    outs: [checkpoints/cnn_regularized.pt, checkpoints/regularized_history, configs/regularize_hyperparams.yaml, reports/regularize_metrics.json, reports/regularize_pareto.png]

  drift_check:
    cmd: python -m pipelines.stage6_drift_check --config params.yaml
    deps: [pipelines/stage6_drift_check.py, src/training/drift.py, src/training/centroid.py, src/evaluation/final_report.py, checkpoints/cnn_regularized.pt, checkpoints/regularized_history, outputs/01_baselines, checkpoints/rf_model.pkl, reports/regularize_metrics.json, reports/leaf_probs.json, data/features_train.npy, data/labels_train.npy]
    params: [seed, data_dir, batch_size, num_workers, num_classes, feature_extraction, drift, centroid_baseline, regularize.routing_temperature, logs_dir]
    outs: [configs/drift_thresholds.yaml, checkpoints/cnn_centroid.pt, reports/ablation]
