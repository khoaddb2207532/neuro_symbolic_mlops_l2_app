name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: flake8 src pipelines --max-line-length=120 --extend-ignore=E203

      - name: Run unit tests
        run: pytest tests/ -v

      # Ở một pipeline production đầy đủ, bước kế tiếp sẽ là:
      #   - dvc repro (chạy lại các stage bị thay đổi trên runner/self-hosted GPU)
      #   - so sánh metrics.json (dvc metrics diff) với model đang production
      #   - chỉ merge/deploy nếu metrics không suy giảm quá ngưỡng cho phép
      # Bước này được để dạng comment vì cần GPU runner riêng, không chạy được
      # trên GitHub-hosted runner miễn phí.
